<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_graph.css') }}">
</head>
<body>
    <button onclick="location.href='/'">Home</button>
    <br>
    <p>This is an ftlrp algorithm solver, please give the data of your graph, and this solver will give you the result</p>
    <form id="form_graph">
        <p>Number of nodes</p>
        <input type="number" id="n_node" name="n_node" value="10">
        <p>Probability of link</p>
        <input type="number" step="0.01" id="link_probability" name="prob_link" value="0.4">
        <p>Minimum distance of link</p>
        <input type="number" id="min_link" name="min_dist" value="2">
        <p>Maximum distance if link</p>
        <input type="number" id="max_link" name="max_dist" value="5">
        <p>Maximum distance allowed to travel</p>
        <input type="number" id="max_travel" name="max_travel" value="8">
        <br>
        <button type="submit">Send</button>
    </form>

    <br>

    <svg id="graph" width="800" height="800"></svg>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="{{ url_for('static', filename='ftlp_menu.js') }}"></script>

</body>
</html>
